services:
  web:
    build:
      context: .
    image: stegoninja-web:latest
    container_name: stegoninja-web
    ports:
      # Host port is overridable via STEGO_WEB_PORT (defaults to 8090).
      - '${STEGO_WEB_PORT:-8090}:80'
    environment:
      # Where the SPA's API requests are proxied. Point this at the running
      # StegoNinja API. When both run under Docker on the same network, use the
      # API service/container name, e.g. http://stegoninja:8080.
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      # Lets the container reach an API bound to the host (Linux support).
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
