<mat-card class="result" appearance="outlined">
  <div class="head">
    <mat-icon class="success" aria-hidden="true">check_circle</mat-icon>
    <h2>{{ heading() }}</h2>
  </div>

  @if (metrics().length) {
    <dl class="metrics">
      @for (m of metrics(); track m.label) {
        <div class="metric" [class.good]="m.tone === 'good'">
          <dt>{{ m.label }}</dt>
          <dd>{{ m.value }}</dd>
        </div>
      }
    </dl>
  }

  <div class="actions">
    <button mat-flat-button type="button" [disabled]="downloading()" (click)="download.emit()">
      @if (downloading()) {
        <mat-spinner diameter="18" aria-hidden="true" />
      } @else {
        <mat-icon aria-hidden="true">download</mat-icon>
      }
      {{ downloadLabel() }}
    </button>

    @if (secondaryLabel()) {
      <button mat-stroked-button type="button" (click)="secondary.emit()">
        {{ secondaryLabel() }}
      </button>
    }
  </div>
</mat-card>
